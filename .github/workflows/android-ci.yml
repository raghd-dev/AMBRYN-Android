name: Android CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Safe compile-time placeholders; never add private Supabase keys here.
      SUPABASE_URL: 'https://example.invalid'
      SUPABASE_PUBLISHABLE_KEY: 'ci_placeholder_no_live_keys'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Run unit tests and build debug APK
        run: bash ./gradlew --no-daemon --console=plain testDebugUnitTest assembleDebug
